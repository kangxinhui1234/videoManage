<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Studio{% endblock %}</title>
<style>
  :root {
    --bg: #f8f9fa; --card: #fff; --text: #212529; --muted: #6b7280;
    --border: #e5e7eb; --accent: #6366f1; --accent-hover: #4f46e5;
    --danger: #ef4444; --success: #22c55e; --warn: #f59e0b;
    --radius: 12px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh}
  nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;
      display:flex;align-items:center;gap:8px;height:56px;position:sticky;top:0;z-index:100}
  nav a{text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:8px;
         font-weight:500;transition:.15s}
  nav a:hover,nav a.active{color:var(--accent);background:#eef2ff}
  nav .brand{font-size:18px;font-weight:700;color:var(--text);margin-right:16px}
  main{max-width:1100px;margin:0 auto;padding:28px 24px}
  h1{font-size:22px;font-weight:700;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
         padding:24px;margin-bottom:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  label{display:block;font-weight:600;margin-bottom:4px;margin-top:12px;font-size:13px}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);
         border-radius:8px;font-size:14px;font-family:inherit;background:#fff;
         transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #6366f120}
  textarea{resize:vertical;min-height:80px}
  button,.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
              background:var(--accent);color:#fff;border:none;border-radius:8px;
              font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{background:var(--accent-hover)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn-outline:hover{background:#eef2ff}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-danger{background:var(--danger)}.btn-danger:hover{background:#dc2626}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .tag-queued{background:#fef3c7;color:#92400e}
  .tag-in_progress{background:#dbeafe;color:#1e40af}
  .tag-completed{background:#dcfce7;color:#166534}
  .tag-failed{background:#fee2e2;color:#991b1b}
  .result-img{width:100%;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:.15s}
  .result-img:hover{transform:scale(1.02);box-shadow:0 4px 16px #00000015}
  .result-video{width:100%;border-radius:8px;border:1px solid var(--border)}
  .flash{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 16px;
         border-radius:8px;margin-bottom:16px;display:none}
  .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;
         color:#fff;font-weight:600;z-index:999;animation:slideUp .3s ease}
  .toast-ok{background:var(--success)}.toast-err{background:var(--danger)}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .spinner{width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;
           border-radius:50%;animation:spin .6s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .flex-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;padding:32px;color:var(--muted)}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}nav{overflow-x:auto}}
</style>
</head>
<body>
<nav>
  <span class="brand">AI Studio</span>
  <a href="/image" class="{% block nav_image %}{% endblock %}">图片生成</a>
  <a href="/edit"  class="{% block nav_edit %}{% endblock %}">图片编辑</a>
  <a href="/video" class="{% block nav_video %}{% endblock %}">视频生成</a>
  <a href="/produce" class="{% block nav_produce %}{% endblock %}">制作中心</a>
  <a href="/script" class="{% block nav_script %}{% endblock %}">剧本工作台</a>
  <a href="/story" class="{% block nav_story %}{% endblock %}">AI 说书</a>
  <a href="/tasks" class="{% block nav_tasks %}{% endblock %}">任务管理</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
function toast(msg, ok=true){let e=document.createElement('div');e.className='toast '+(ok?'toast-ok':'toast-err');e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function $(id){return document.getElementById(id)}
function showSpinner(id){const s=$(id);if(s)s.style.display='inline-block'}
function hideSpinner(id){const s=$(id);if(s)s.style.display='none'}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
